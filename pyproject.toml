[project]
name = "gpuctl"
version = "0.1.0"
description = "Provision, track and auto-wire Vast.ai GPU instances into opencode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
gpuctl = "gpuctl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpuctl"]
